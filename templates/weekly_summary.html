{% extends "base.html" %}{% block content %}<h2>Сводка за неделю</h2><div class="row g-3 my-3"><div class="col-md-4"><div class="card p-3">Новые инструменты<h2 id="tools">—</h2></div></div><div class="col-md-4"><div class="card p-3">Обновления<h2 id="updates">—</h2></div></div><div class="col-md-4"><div class="card p-3">Изменения тарифов<h2 id="pricing">—</h2></div></div></div><div class="filter-card"><h5>Активность по дням</h5><div id="chart"></div></div><div class="filter-card mt-4"><h5>Самые упоминаемые разработчики</h5><div id="developers"></div></div><script>async function load(){let d=await (await fetch('/api/weekly-summary')).json();tools.textContent=d.new_tools;updates.textContent=d.new_updates;pricing.textContent=d.new_pricing;Plotly.newPlot('chart',[{x:d.news_by_day.map(x=>x.date),y:d.news_by_day.map(x=>x.count),type:'bar',marker:{color:'#6366f1'}}],{margin:{t:10},height:260});developers.innerHTML=d.top_developers.map(x=>`<div class="d-flex justify-content-between border-bottom py-2"><a href="/developer/${encodeURIComponent(x.name)}">${x.name}</a><b>${x.count}</b></div>`).join('')||'Нет событий за неделю.'}load()</script>{% endblock %}
