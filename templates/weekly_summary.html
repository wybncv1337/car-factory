{% extends "base.html" %}

{% block content %}
<div class="p-4">
    <h2 class="mb-4">Сводка за неделю</h2>

    <!-- Stats Cards -->
    <div class="row mb-4" id="statsCards"></div>

    <!-- Chart -->
    <div class="filter-card mb-4">
        <h5>Динамика новостей по дням</h5>
        <div id="newsChart" style="height: 300px;"></div>
    </div>

    <!-- Top Companies -->
    <div class="filter-card">
        <h5>Топ компаний по упоминаниям</h5>
        <div id="topCompaniesList"></div>
    </div>
</div>

<script>
async function loadWeeklySummary() {
    try {
        const response = await fetch('/api/weekly-summary');
        const data = await response.json();

        displayStats(data);
        displayChart(data);
        displayTopCompanies(data.top_companies);

    } catch (error) {
        console.error("Ошибка загрузки:", error);
    }
}

function displayStats(data) {
    const container = document.getElementById('statsCards');
    container.innerHTML = `
        <div class="col-md-4 mb-3">
            <div class="card card-stats">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="text-muted">Новые вакансии</h6>
                            <h2 class="text-success mb-0">+${data.new_vacancies || 0}</h2>
                        </div>
                        <div class="stat-icon bg-success bg-opacity-10 p-3 rounded">
                            <i class="fas fa-user-tie text-success fa-2x"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-4 mb-3">
            <div class="card card-stats">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="text-muted">Новые релизы</h6>
                            <h2 class="text-danger mb-0">+${data.new_releases || 0}</h2>
                        </div>
                        <div class="stat-icon bg-danger bg-opacity-10 p-3 rounded">
                            <i class="fas fa-car text-danger fa-2x"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-4 mb-3">
            <div class="card card-stats">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="text-muted">Новые цены</h6>
                            <h2 class="text-warning mb-0">+${data.new_prices || 0}</h2>
                        </div>
                        <div class="stat-icon bg-warning bg-opacity-10 p-3 rounded">
                            <i class="fas fa-tag text-warning fa-2x"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    `;
}

function displayChart(data) {
    const dates = data.news_by_day.map(d => d.date);
    const counts = data.news_by_day.map(d => d.count);

    const trace = {
        x: dates,
        y: counts,
        type: 'scatter',
        mode: 'lines+markers',
        name: 'Новости',
        line: { color: '#667eea', width: 3 },
        marker: { size: 8, color: '#764ba2' },
        fill: 'tozeroy',
        fillcolor: 'rgba(102, 126, 234, 0.1)'
    };

    const layout = {
        xaxis: { title: 'Дата', tickangle: -45 },
        yaxis: { title: 'Количество новостей' },
        plot_bgcolor: 'white',
        paper_bgcolor: 'white',
        margin: { t: 10, b: 80, l: 50, r: 30 }
    };

    Plotly.newPlot('newsChart', [trace], layout, { responsive: true });
}

function displayTopCompanies(companies) {
    const container = document.getElementById('topCompaniesList');
    container.innerHTML = '';

    if (!companies || companies.length === 0) {
        container.innerHTML = '<p class="text-muted">Нет данных</p>';
        return;
    }

    let html = '<div class="list-group">';
    companies.forEach(company => {
        html += `
            <div class="list-group-item d-flex justify-content-between align-items-center">
                <a href="/company/${encodeURIComponent(company.name)}" class="text-decoration-none">
                    <i class="fas fa-building me-2 text-primary"></i> ${company.name}
                </a>
                <span class="badge bg-primary rounded-pill">${company.count} упоминаний</span>
            </div>
        `;
    });
    html += '</div>';
    container.innerHTML = html;
}

document.addEventListener('DOMContentLoaded', loadWeeklySummary);
</script>
{% endblock %}
