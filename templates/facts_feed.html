{% extends "base.html" %}{% block content %}<h2>Лента событий</h2><div class="filter-card my-3 row g-3"><div class="col-md-4"><label class="form-label">Тип события</label><select id="type" class="form-select"><option value="">Все события</option><option value="tool">Новые инструменты</option><option value="update">Обновления</option><option value="pricing">Тарифы и лимиты</option></select></div><div class="col-md-5"><label class="form-label">Разработчик</label><input id="developer" class="form-control" placeholder="Например, OpenAI"></div><div class="col-md-3 d-flex align-items-end"><button class="btn btn-primary w-100" onclick="load()">Показать</button></div></div><div id="facts"></div><script>const labels={tool:'Инструмент',update:'Обновление',pricing:'Тариф'};function esc(v){let x=document.createElement('span');x.textContent=v||'';return x.innerHTML}function btn(u,t,i){return u?`<a class="btn btn-sm btn-outline-primary me-1" href="${esc(u)}" target="_blank" rel="noopener"><i class="fa-solid ${i} me-1"></i>${t}</a>`:''}async function load(){let q=new URLSearchParams({limit:100});if(type.value)q.set('type',type.value);if(developer.value)q.set('developer',developer.value);let d=await (await fetch('/api/facts?'+q)).json();facts.innerHTML=d.facts.length?d.facts.map(f=>{let x=f.data;return `<article class="fact-card"><span class="badge bg-primary">${labels[f.type]}</span><span class="text-muted ms-2">${esc(x.developer||'')}</span><small class="text-muted float-end"><i class="fa-regular fa-calendar me-1"></i>${dateLabel(f.created_at)}</small><h5 class="mt-2">${esc(x.name||x.value)}</h5><p>${esc(x.description||'')}</p>${x.price?`<p><b>${esc(x.price)}</b></p>`:''}${btn(f.company_url,'Сайт компании','fa-building')+btn(f.news_url,'Читать новость','fa-newspaper')+btn(f.source_url,'Сайт продукта','fa-arrow-up-right-from-square')}</article>`}).join(''):'<div class="alert alert-info">Ничего не найдено.</div>'}load()</script>{% endblock %}
