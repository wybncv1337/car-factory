{% extends "base.html" %}{% block content %}<h2>Разработчики ИИ-инструментов</h2><div class="filter-card"><input id="search" class="form-control" placeholder="Найти разработчика" oninput="render()"></div><div id="list" class="row mt-3"></div><script>let all=[];async function load(){all=await (await fetch('/api/developers')).json();render()}function render(){let q=search.value.toLowerCase();list.innerHTML=all.filter(x=>x.toLowerCase().includes(q)).map(x=>`<div class="col-md-4 mb-3"><a class="text-decoration-none" href="/developer/${encodeURIComponent(x)}"><div class="card p-4 h-100"><i class="fa-solid fa-building text-primary mb-2"></i><h5 class="mb-0">${x}</h5></div></a></div>`).join('')||'<p class="text-muted">Нет данных.</p>'}load()</script>{% endblock %}
