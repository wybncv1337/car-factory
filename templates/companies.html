{% extends "base.html" %}
{% block content %}
<header class="page-head">
  <p class="eyebrow">Компании</p>
  <h1>Разработчики ИИ-инструментов</h1>
  <p>Заходи в карточку компании, чтобы увидеть все её анонсы, обновления и изменения тарифов в одном месте.</p>
</header>

<section class="panel mb-4">
  <label class="form-label" for="search">Поиск</label>
  <input id="search" class="form-control" placeholder="Например, Anthropic или Яндекс" oninput="render()">
</section>

<div id="list" class="row g-3"></div>

<script>
  let all = [];

  function esc(value) {
    const node = document.createElement('span');
    node.textContent = value || '';
    return node.innerHTML;
  }

  function render() {
    const query = search.value.trim().toLowerCase();
    const matches = all.filter(name => name.toLowerCase().includes(query));
    list.innerHTML = matches.length
      ? matches.map(name => `<div class="col-md-6 col-xl-4">
          <a class="dev-card" href="/developer/${encodeURIComponent(name)}">
            <span class="dev-avatar">${esc(name.trim().charAt(0))}</span>
            <span>
              <h3>${esc(name)}</h3>
              <span class="dev-sub">Смотреть события <i class="fa-solid fa-arrow-right-long ms-1"></i></span>
            </span>
          </a>
        </div>`).join('')
      : '<div class="empty"><i class="fa-solid fa-magnifying-glass"></i>Никого не нашли по запросу.</div>';
  }

  async function load() {
    all = await (await fetch('/api/developers')).json();
    render();
  }

  load();
</script>
{% endblock %}
