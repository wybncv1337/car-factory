<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AI News — что нового в ИИ-инструментах{% endblock %}</title>
  <meta name="description" content="Обновления ИИ-инструментов, новые сервисы и изменения тарифов за последние два месяца.">
  <meta name="theme-color" content="#6366f1">
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link rel="alternate icon" href="{{ url_for('static', filename='favicon.png') }}" sizes="48x48" type="image/png">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='site.css') }}" rel="stylesheet">
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <script>window.dateLabel = v => {
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(v || '');
    if (!m) return '';
    const months = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
    return `${+m[3]} ${months[+m[2] - 1]} ${m[1]}`;
  };</script>
</head>
<body>
<div class="page-shell">
  <div class="layout">
    {% set path = request.path %}
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-logo"><img src="{{ url_for('static', filename='favicon.svg') }}" alt="Логотип AI News"></span>
        <span>
          <h4 class="brand-name mb-0">AI News</h4>
          <small class="brand-sub">мониторинг ИИ</small>
        </span>
      </div>
      <span class="side-label">Разделы</span>
      <nav class="side-nav">
        <a href="/" class="{{ 'active' if path == '/' }}"><i class="fa-solid fa-chart-line"></i>Главная</a>
        <a href="/facts-feed" class="{{ 'active' if path == '/facts-feed' }}"><i class="fa-solid fa-newspaper"></i>Лента событий</a>
        <a href="/developers" class="{{ 'active' if path.startswith('/developer') }}"><i class="fa-solid fa-building"></i>Разработчики</a>
        <a href="/weekly-summary" class="{{ 'active' if path == '/weekly-summary' }}"><i class="fa-solid fa-calendar-week"></i>Сводка за неделю</a>
      </nav>
      <div class="side-note">
        <b>Как это работает.</b> Карточки собираются с официальных страниц новостей компаний; кнопка «Читать новость» ведёт на конкретный анонс.
      </div>
    </aside>
    <main>
      {% block content %}{% endblock %}
    </main>
  </div>
</div>
</body>
</html>
