{% extends "base.html" %}

{% block content %}
<div class="p-4">
    <h2 class="mb-4">Главная</h2>

    <!-- Stats Cards -->
    <div class="row" id="stats">
        <div class="col-md-3 mb-3">
            <div class="card card-stats">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="text-muted">Всего фактов</h6>
                            <h2 id="totalFacts" class="text-primary mb-0">-</h2>
                        </div>
                        <div class="stat-icon bg-primary bg-opacity-10 p-3 rounded">
                            <i class="fas fa-database text-primary fa-2x"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-3 mb-3">
            <div class="card card-stats">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="text-muted">Вакансии</h6>
                            <h2 id="totalVacancies" class="text-success mb-0">-</h2>
                        </div>
                        <div class="stat-icon bg-success bg-opacity-10 p-3 rounded">
                            <i class="fas fa-user-tie text-success fa-2x"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-3 mb-3">
            <div class="card card-stats">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="text-muted">Релизы</h6>
                            <h2 id="totalReleases" class="text-danger mb-0">-</h2>
                        </div>
                        <div class="stat-icon bg-danger bg-opacity-10 p-3 rounded">
                            <i class="fas fa-car text-danger fa-2x"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-3 mb-3">
            <div class="card card-stats">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="text-muted">Цены</h6>
                            <h2 id="totalPrices" class="text-warning mb-0">-</h2>
                        </div>
                        <div class="stat-icon bg-warning bg-opacity-10 p-3 rounded">
                            <i class="fas fa-tag text-warning fa-2x"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Дневной график -->
    <div class="filter-card mt-4">
        <h5><i class="fas fa-chart-line"></i> Динамика фактов (последние 30 дней)</h5>
        <div id="dailyChart" style="height: 400px;"></div>
    </div>

    <!-- Месячный график -->
    <div class="filter-card mt-4">
        <h5><i class="fas fa-chart-bar"></i> Динамика по месяцам</h5>
        <div id="monthlyChart" style="height: 400px;"></div>
    </div>

    <!-- Круговая диаграмма -->
    <div class="filter-card mt-4">
        <h5><i class="fas fa-chart-pie"></i> Распределение по типам</h5>
        <div id="typeChart" style="height: 400px;"></div>
    </div>

    <!-- Последние факты -->
    <div class="filter-card mt-4">
        <h5><i class="fas fa-clock"></i> Последние факты</h5>
        <div id="factsList"></div>
    </div>
</div>

<script>
async function loadDashboard() {
    console.log("Loading dashboard...");

    try {
        // Загружаем метрики
        const metricsRes = await fetch('/api/metrics');
        const metrics = await metricsRes.json();
        console.log("Metrics loaded:", metrics);

        // Обновляем карточки
        document.getElementById('totalFacts').textContent = metrics.total_facts || 0;
        document.getElementById('totalVacancies').textContent = metrics.total_vacancies || 0;
        document.getElementById('totalReleases').textContent = metrics.total_releases || 0;
        document.getElementById('totalPrices').textContent = metrics.total_prices || 0;

        // Рисуем графики
        drawDailyChart(metrics.daily_stats);
        drawMonthlyChart(metrics.monthly_stats);
        drawPieChart(metrics.type_stats);

    } catch (error) {
        console.error("Error loading metrics:", error);
        document.getElementById('stats').innerHTML = '<div class="alert alert-danger">Ошибка загрузки метрик</div>';
    }

    try {
        // Загружаем последние факты
        const factsRes = await fetch('/api/facts?limit=10');
        const factsData = await factsRes.json();
        console.log("Facts loaded:", factsData.facts?.length || 0);

        const container = document.getElementById('factsList');
        container.innerHTML = '';

        if (factsData.facts && factsData.facts.length > 0) {
            factsData.facts.forEach(fact => {
                let value = '';
                if (fact.data && fact.data.value) {
                    value = fact.data.value;
                } else if (fact.data) {
                    value = JSON.stringify(fact.data);
                } else {
                    value = 'Нет данных';
                }

                const typeIcon = fact.type === 'vacancy' ? 'fa-user-tie' : (fact.type === 'release' ? 'fa-car' : 'fa-tag');
                const typeColor = fact.type === 'vacancy' ? 'success' : (fact.type === 'release' ? 'danger' : 'warning');

                const card = document.createElement('div');
                card.className = 'fact-card';
                card.innerHTML = `
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <span class="badge bg-${typeColor} me-2">
                                <i class="fas ${typeIcon}"></i> ${fact.type || 'fact'}
                            </span>
                            <span class="badge bg-secondary">confidence: ${Math.round((fact.confidence || 0.5) * 100)}%</span>
                        </div>
                        <small class="text-muted">${fact.created_at ? fact.created_at.slice(0, 10) : ''}</small>
                    </div>
                    <div class="mt-2">
                        <strong>${escapeHtml(value.substring(0, 200))}</strong>
                    </div>
                `;
                container.appendChild(card);
            });
        } else {
            container.innerHTML = '<p class="text-muted text-center py-3">Нет данных</p>';
        }

    } catch (error) {
        console.error("Error loading facts:", error);
        document.getElementById('factsList').innerHTML = '<div class="alert alert-danger">Ошибка загрузки фактов</div>';
    }
}

function drawDailyChart(data) {
    if (!data || data.length === 0) {
        document.getElementById('dailyChart').innerHTML = '<p class="text-muted text-center py-5">Нет данных для графика</p>';
        return;
    }

    const dates = data.map(d => d.date);
    const counts = data.map(d => d.count);

    const trace = {
        x: dates,
        y: counts,
        type: 'scatter',
        mode: 'lines+markers',
        name: 'Факты',
        line: { color: '#667eea', width: 3 },
        marker: { size: 6, color: '#764ba2' },
        fill: 'tozeroy',
        fillcolor: 'rgba(102, 126, 234, 0.1)'
    };

    const layout = {
        title: '',
        xaxis: { title: 'Дата', tickangle: -45 },
        yaxis: { title: 'Количество' },
        plot_bgcolor: 'white',
        paper_bgcolor: 'white',
        margin: { t: 10, b: 80, l: 50, r: 30 },
        hovermode: 'closest'
    };

    Plotly.newPlot('dailyChart', [trace], layout, { responsive: true });
}

function drawMonthlyChart(data) {
    if (!data || data.length === 0) {
        document.getElementById('monthlyChart').innerHTML = '<p class="text-muted text-center py-5">Нет данных для графика</p>';
        return;
    }

    const months = data.map(d => d.month);
    const counts = data.map(d => d.count);

    const trace = {
        x: months,
        y: counts,
        type: 'bar',
        name: 'Факты',
        marker: {
            color: '#764ba2',
            line: { color: '#667eea', width: 1 }
        }
    };

    const layout = {
        title: '',
        xaxis: { title: 'Месяц', tickangle: -45 },
        yaxis: { title: 'Количество' },
        plot_bgcolor: 'white',
        paper_bgcolor: 'white',
        margin: { t: 10, b: 80, l: 50, r: 30 }
    };

    Plotly.newPlot('monthlyChart', [trace], layout, { responsive: true });
}

function drawPieChart(data) {
    if (!data || data.length === 0) {
        document.getElementById('typeChart').innerHTML = '<p class="text-muted text-center py-5">Нет данных для диаграммы</p>';
        return;
    }

    const labels = data.map(d => {
        if (d.type === 'vacancy') return 'Вакансии';
        if (d.type === 'release') return 'Релизы';
        if (d.type === 'price') return 'Цены';
        return d.type || 'Другое';
    });
    const values = data.map(d => d.count);
    const colors = ['#28a745', '#dc3545', '#ffc107', '#6c757d'];

    const trace = {
        labels: labels,
        values: values,
        type: 'pie',
        marker: { colors: colors.slice(0, labels.length) },
        textinfo: 'label+percent',
        hoverinfo: 'label+value+percent',
        textposition: 'auto'
    };

    const layout = {
        title: '',
        height: 400,
        showlegend: true,
        legend: { orientation: 'h', y: -0.1 }
    };

    Plotly.newPlot('typeChart', [trace], layout, { responsive: true });
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// Загружаем при загрузке страницы
document.addEventListener('DOMContentLoaded', loadDashboard);
// Обновляем каждые 5 минут
setInterval(loadDashboard, 300000);
</script>
{% endblock %}
