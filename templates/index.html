{% extends "base.html" %}{% block content %}<h2>AI News</h2><p class="text-muted">Новости об ИИ-инструментах, обновлениях и изменениях тарифов за последние два месяца.</p><div class="row g-3 my-3"><div class="col-md-3"><div class="card p-3"><small>Всего событий</small><h2 id="all">—</h2></div></div><div class="col-md-3"><div class="card p-3"><small>Инструменты</small><h2 id="tools" class="text-primary">—</h2></div></div><div class="col-md-3"><div class="card p-3"><small>Обновления</small><h2 id="updates" class="text-success">—</h2></div></div><div class="col-md-3"><div class="card p-3"><small>Тарифы и лимиты</small><h2 id="pricing" class="text-warning">—</h2></div></div></div><div class="filter-card mb-4"><h5>Динамика событий за 60 дней</h5><div id="chart"></div></div><h4>Последние события</h4><div id="facts"></div><script>const labels={tool:'Инструмент',update:'Обновление',pricing:'Тариф'};function esc(v){let e=document.createElement('span');e.textContent=v||'';return e.innerHTML}function card(f){let d=f.data;let btn=(u,t)=>u?`<a class="btn btn-sm btn-outline-primary mt-2 me-1" href="${esc(u)}" target="_blank" rel="noopener"><i class="fa-solid fa-arrow-up-right-from-square me-1"></i>${t}</a>`:'';let link=btn(f.company_url,'Сайт компании')+btn(f.source_url,'Сайт продукта');return `<article class="fact-card"><span class="badge bg-primary">${labels[f.type]}</span><span class="text-muted ms-2">${esc(d.developer||'Без разработчика')} · ${esc(d.category||'')}</span><h5 class="mt-2">${esc(d.name||d.value)}</h5><p class="mb-1">${esc(d.description||'')}</p>${d.price?`<small><b>${esc(d.price)}</b></small>`:''}<br>${link}</article>`}async function load(){let m=await (await fetch('/api/metrics')).json();all.textContent=m.total_facts;tools.textContent=m.total_tools;updates.textContent=m.total_updates;pricing.textContent=m.total_pricing;Plotly.newPlot('chart',[{x:m.daily_stats.map(x=>x.date),y:m.daily_stats.map(x=>x.count),type:'scatter',mode:'lines+markers',line:{color:'#6366f1'}}],{margin:{t:10},height:280});let d=await (await fetch('/api/facts?limit=5')).json();facts.innerHTML=d.facts.map(card).join('')}load()</script>{% endblock %}
