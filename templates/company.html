{% extends "base.html" %}

{% block content %}
<div class="p-4">
    <h2 class="mb-4"><i class="fas fa-building"></i> <span id="companyName">{{ company }}</span></h2>

    <div class="row mb-4" id="statsCards"></div>

    <div class="filter-card">
        <div class="row g-3">
            <div class="col-md-3">
                <label class="form-label">Категория</label>
                <select id="filterCategory" class="form-select">
                    <option value="all">Все</option>
                    <option value="vacancy">Вакансии</option>
                    <option value="release">Релизы</option>
                    <option value="price">Цены</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">Сортировать по</label>
                <select id="sortBy" class="form-select">
                    <option value="date">Дате</option>
                    <option value="confidence">Достоверности</option>
                    <option value="type">Типу</option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label">Порядок</label>
                <select id="sortOrder" class="form-select">
                    <option value="desc">По убыванию</option>
                    <option value="asc">По возрастанию</option>
                </select>
            </div>
            <div class="col-md-4 d-flex align-items-end">
                <button class="btn btn-primary" onclick="loadCompanyFacts()">
                    <i class="fas fa-search"></i> Применить
                </button>
            </div>
        </div>
    </div>

    <h4 class="mt-4 mb-3">Факты о компании</h4>
    <div id="factsList"></div>
</div>

<script>
const companyName = '{{ company }}';

async function loadCompanyFacts() {
    const category = document.getElementById('filterCategory').value;
    const sortBy = document.getElementById('sortBy').value;
    const order = document.getElementById('sortOrder').value;

    try {
        const response = await fetch(`/api/company/${encodeURIComponent(companyName)}?category=${category}&sort_by=${sortBy}&order=${order}`);
        const data = await response.json();

        displayStats(data.stats);
        displayFacts(data.facts);
        document.getElementById('companyName').textContent = data.company;

    } catch (error) {
        console.error(error);
    }
}

function displayStats(stats) {
    const container = document.getElementById('statsCards');
    container.innerHTML = `
        <div class="col-md-3 mb-3">
            <div class="card card-stats">
                <div class="card-body">
                    <h6 class="text-muted">Всего фактов</h6>
                    <h2 class="text-primary mb-0">${stats.total}</h2>
                </div>
            </div>
        </div>
        <div class="col-md-3 mb-3">
            <div class="card card-stats">
                <div class="card-body">
                    <h6 class="text-muted">Вакансии</h6>
                    <h2 class="text-success mb-0">${stats.vacancies}</h2>
                </div>
            </div>
        </div>
        <div class="col-md-3 mb-3">
            <div class="card card-stats">
                <div class="card-body">
                    <h6 class="text-muted">Релизы</h6>
                    <h2 class="text-danger mb-0">${stats.releases}</h2>
                </div>
            </div>
        </div>
        <div class="col-md-3 mb-3">
            <div class="card card-stats">
                <div class="card-body">
                    <h6 class="text-muted">Цены</h6>
                    <h2 class="text-warning mb-0">${stats.prices}</h2>
                </div>
            </div>
        </div>
    `;
}

function displayFacts(facts) {
    const container = document.getElementById('factsList');
    container.innerHTML = '';

    if (facts.length === 0) {
        container.innerHTML = '<div class="alert alert-info">Факты не найдены</div>';
        return;
    }

    facts.forEach(fact => {
        const typeColor = fact.type === 'vacancy' ? 'success' : (fact.type === 'release' ? 'danger' : 'warning');
        const typeName = fact.type === 'vacancy' ? 'Вакансия' : (fact.type === 'release' ? 'Релиз' : 'Цена');
        const value = fact.data?.value || 'Нет данных';
        const date = fact.created_at ? new Date(fact.created_at).toLocaleDateString('ru-RU') : '';

        let sourceLink = '';
        if (fact.source_url) {
            sourceLink = `<a href="${fact.source_url}" target="_blank" class="btn btn-sm btn-outline-primary mt-2">
                            <i class="fas fa-external-link-alt"></i> Перейти к источнику
                          </a>`;
        }

        const card = document.createElement('div');
        card.className = 'fact-card';
        card.innerHTML = `
            <div class="d-flex justify-content-between align-items-start">
                <div>
                    <span class="badge bg-${typeColor} me-2">${typeName}</span>
                    <span class="badge bg-secondary">достоверность: ${Math.round((fact.confidence || 0.5) * 100)}%</span>
                </div>
                <small class="text-muted">${date}</small>
            </div>
            <div class="mt-2"><strong>${escapeHtml(value.substring(0, 250))}</strong></div>
            ${sourceLink}
        `;
        container.appendChild(card);
    });
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

document.addEventListener('DOMContentLoaded', loadCompanyFacts);
</script>
{% endblock %}
