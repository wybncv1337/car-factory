{% extends "base.html" %}{% block content %}<h2 id="name">{{ developer }}</h2><p class="text-muted">События, связанные с этим разработчиком.</p><div class="row g-3 mb-4"><div class="col-md-3"><div class="card p-3">Всего<h2 id="total">—</h2></div></div><div class="col-md-3"><div class="card p-3">Инструменты<h2 id="tools">—</h2></div></div><div class="col-md-3"><div class="card p-3">Обновления<h2 id="updates">—</h2></div></div><div class="col-md-3"><div class="card p-3">Тарифы<h2 id="pricing">—</h2></div></div></div><div id="facts"></div><script>async function load(){let d=await (await fetch('/api/developer/{{ developer|urlencode }}')).json();total.textContent=d.stats.total;tools.textContent=d.stats.tools;updates.textContent=d.stats.updates;pricing.textContent=d.stats.pricing;facts.innerHTML=d.facts.map(f=>`<article class="fact-card"><b>${f.data.name||f.data.value}</b><p class="mb-0 mt-2">${f.data.description||''}</p></article>`).join('')}load()</script>{% endblock %}
